name: Build iOS IPA & Widget

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 25

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Mostra Versione Xcode
        run: xcodebuild -version

      - name: Installa XcodeGen
        run: brew install xcodegen

      - name: Genera Progetto Xcode
        run: |
          xcodegen generate
          xcodebuild -list -project AlignerTrack.xcodeproj

      - name: Compila App e Widget (.app)
        run: |
          xcodebuild build \
            -project AlignerTrack.xcodeproj \
            -scheme AlignerTrack \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Crea Pacchetto .IPA
        run: |
          mkdir -p build/Payload
          cp -r build/Build/Products/Release-iphoneos/AlignerTrack.app build/Payload/
          cd build && zip -r -9 AlignerTrack.ipa Payload

      - name: Carica file .IPA negli Artifacts di GitHub
        uses: actions/upload-artifact@v4
        with:
          name: AlignerTrack-iOS
          path: build/AlignerTrack.ipa
          retention-days: 7
