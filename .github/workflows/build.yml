name: Build iOS IPA & Widget

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Mostra Versione Xcode
        run: xcodebuild -version

      - name: Installa XcodeGen
        run: brew install xcodegen

      - name: Genera Progetto Xcode
        run: |
          xcodegen generate
          sed -i '' 's/objectVersion = 77;/objectVersion = 56;/g' AlignerTrack.xcodeproj/project.pbxproj || true

      - name: Lista Scheme Disponibili
        run: xcodebuild -project AlignerTrack.xcodeproj -list

      - name: Compila App e Widget (.app)
        run: |
          xcodebuild build \
            -project AlignerTrack.xcodeproj \
            -scheme AlignerTrack \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -derivedDataPath build \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Crea Pacchetto .IPA
        run: |
          mkdir -p build/Payload
          rm -rf build/Payload/*
          cp -r build/Build/Products/Release-iphoneos/AlignerTrack.app build/Payload/
          APP_PLIST="build/Payload/AlignerTrack.app/Info.plist"
          if [ -f "$APP_PLIST" ]; then
            /usr/libexec/PlistBuddy -c "Add :UILaunchScreen dict" "$APP_PLIST" || true
            /usr/libexec/PlistBuddy -c "Add :UIFileSharingEnabled bool true" "$APP_PLIST" || true
            /usr/libexec/PlistBuddy -c "Add :LSSupportsOpeningDocumentsInPlace bool true" "$APP_PLIST" || true
          fi
          WIDGET_PLIST="build/Payload/AlignerTrack.app/PlugIns/AlignerWidgetExtension.appex/Info.plist"
          if [ -f "$WIDGET_PLIST" ]; then
            /usr/libexec/PlistBuddy -c "Add :NSExtension dict" "$WIDGET_PLIST" || true
            /usr/libexec/PlistBuddy -c "Add :NSExtension:NSExtensionPointIdentifier string com.apple.widgetkit-extension" "$WIDGET_PLIST" || true
          fi
          cd build && zip -r -9 AlignerTrack.ipa Payload

      - name: Carica file .IPA negli Artifacts di GitHub
        uses: actions/upload-artifact@v4
        with:
          name: AlignerTrack-iOS
          path: build/AlignerTrack.ipa
          retention-days: 7
