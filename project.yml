name: AlignerTrack
options:
  bundleIdPrefix: com.alignertrack
  deploymentTarget:
    iOS: 17.0
  createIntermediateGroups: true
  generateEmptyDirectories: true

targets:
  AlignerTrack:
    type: application
    platform: iOS
    deploymentTarget: 17.0
    sources:
      - path: iOS/AlignerTrackApp.swift
      - path: iOS/Models
      - path: iOS/Services
      - path: iOS/Views
    info:
      path: iOS/Info.plist
      properties:
        UILaunchScreen: {}
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        CFBundleURLTypes:
          - CFBundleURLName: com.alignertrack.app
            CFBundleURLSchemes:
              - alignertrack
    entitlements:
      path: iOS/AlignerTrack.entitlements
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.alignertrack.app
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: iOS/Info.plist
        SWIFT_VERSION: "5.9"
        CODE_SIGN_STYLE: Manual
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGN_IDENTITY: ""
        IPHONEOS_DEPLOYMENT_TARGET: 17.0
        TARGETED_DEVICE_FAMILY: "1"
    dependencies:
      - target: AlignerWidgetExtension
        embed: true

  AlignerWidgetExtension:
    type: app-extension
    platform: iOS
    deploymentTarget: 17.0
    sources:
      - path: iOS/Models
      - path: iOS/Widget
    info:
      path: iOS/WidgetInfo.plist
      properties:
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: iOS/AlignerWidget.entitlements
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.alignertrack.app.widget
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: iOS/WidgetInfo.plist
        SWIFT_VERSION: "5.9"
        CODE_SIGN_STYLE: Manual
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGN_IDENTITY: ""
        IPHONEOS_DEPLOYMENT_TARGET: 17.0
        TARGETED_DEVICE_FAMILY: "1"

schemes:
  AlignerTrack:
    build:
      targets:
        AlignerTrack: all
        AlignerWidgetExtension: all
    run:
      config: Release
    archive:
      config: Release
