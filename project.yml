name: AlignerTrack
options:
  bundleIdPrefix: com.alignertrack
  deploymentTarget:
    iOS: 17.0
  xcodeVersion: '16.0'

targets:
  AlignerTrack:
    type: application
    platform: iOS
    deploymentTarget: 17.0
    sources:
      - path: iOS/AlignerTrackApp.swift
      - path: iOS/Models
      - path: iOS/Services
      - path: iOS/Views
    entitlements:
      path: iOS/AlignerTrack.entitlements
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.alignertrack.app
        INFOPLIST_KEY_CFBundleDisplayName: AlignerTrack
        GENERATE_INFOPLIST_FILE: YES
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: 1.0.0
        SWIFT_VERSION: '5.9'
    dependencies:
      - target: AlignerWidgetExtension

  AlignerWidgetExtension:
    type: app-extension
    platform: iOS
    deploymentTarget: 17.0
    sources:
      - path: iOS/Models
      - path: iOS/Services
      - path: iOS/Widget
    entitlements:
      path: iOS/AlignerWidget.entitlements
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.alignertrack.app.widget
        INFOPLIST_KEY_CFBundleDisplayName: AlignerWidget
        GENERATE_INFOPLIST_FILE: YES
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: 1.0.0
        SWIFT_VERSION: '5.9'
