name: AlignerTrack
options:
  bundleIdPrefix: com.alignertrack
  deploymentTarget:
    iOS: 17.0
  createIntermediateGroups: true
  generateEmptyDirectories: true

targets:
  AlignerTrack:
    type: application
    platform: iOS
    deploymentTarget: 17.0
    sources:
      - path: iOS/AlignerTrackApp.swift
      - path: iOS/Models
      - path: iOS/Services
      - path: iOS/Views
    info:
      path: iOS/Info.plist
    entitlements:
      path: iOS/AlignerTrack.entitlements
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.alignertrack.app
        SWIFT_VERSION: "5.9"
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGN_IDENTITY: ""
        IPHONEOS_DEPLOYMENT_TARGET: 17.0
    dependencies:
      - target: AlignerWidgetExtension

  AlignerWidgetExtension:
    type: app-extension
    platform: iOS
    deploymentTarget: 17.0
    sources:
      - path: iOS/Models
      - path: iOS/Services
      - path: iOS/Widget
    info:
      path: iOS/WidgetInfo.plist
    entitlements:
      path: iOS/AlignerWidget.entitlements
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.alignertrack.app.widget
        SWIFT_VERSION: "5.9"
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGN_IDENTITY: ""
        IPHONEOS_DEPLOYMENT_TARGET: 17.0

schemes:
  AlignerTrack:
    build:
      targets:
        AlignerTrack: all
        AlignerWidgetExtension: all
    run:
      config: Release
    archive:
      config: Release
