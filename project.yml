name: AlignerTrack
options:
  bundleIdPrefix: com.alignertrack
  deploymentTarget:
    iOS: 17.0

targets:
  AlignerTrack:
    type: application
    platform: iOS
    deploymentTarget: 17.0
    sources:
      - path: iOS/AlignerTrackApp.swift
      - path: iOS/Models
      - path: iOS/Services
      - path: iOS/Views
    info:
      path: iOS/Info.plist
    entitlements:
      path: iOS/AlignerTrack.entitlements
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.alignertrack.app
        SWIFT_VERSION: '5.9'
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGN_IDENTITY: ""
    dependencies:
      - target: AlignerWidgetExtension

  AlignerWidgetExtension:
    type: app-extension
    platform: iOS
    deploymentTarget: 17.0
    sources:
      - path: iOS/Models
      - path: iOS/Services
      - path: iOS/Widget
        excludes:
          - Info.plist
    info:
      path: iOS/Widget/Info.plist
    entitlements:
      path: iOS/AlignerWidget.entitlements
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.alignertrack.app.widget
        SWIFT_VERSION: '5.9'
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGN_IDENTITY: ""
